# Docker Compose - MySQL + Backend for Movie Ticket Booking App
# Usage: docker-compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: account_security_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: account_security_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie_booking_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      # Point to mysql service by container hostname, port 3306 (internal)
      DATABASE_URL: "mysql://root:root_password@mysql:3306/account_security_db"
      JWT_ACCESS_SECRET: dev_access_secret_key_2024_account_security_system
      JWT_REFRESH_SECRET: dev_refresh_secret_key_2024_account_security_system
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: hoangnguyenduc6704@gmail.com
      SMTP_PASS: anyz nilh glgj jmui
      SMTP_FROM: "Movie App <hoangnguyenduc6704@gmail.com>"
      MAX_FAILED_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 5
      EMAIL_CODE_EXPIRY_MINUTES: 10
      OTP_EXPIRY_MINUTES: 5
      RESEND_COOLDOWN_SECONDS: 60
      GOOGLE_CLIENT_ID: 287970275919-8h77qpivl9gegvoskvmgrsp21linpkr.apps.googleusercontent.com
      GOOGLE_ANDROID_CLIENT_ID: 287970275919-rm8g5oh2uu6oer9m3tcar1gq8d3oc4q1.apps.googleusercontent.com
    ports:
      - "5000:5000"

volumes:
  mysql_data:
    driver: local
